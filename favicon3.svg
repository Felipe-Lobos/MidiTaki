<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo principal claro -->
  <rect width="512" height="512" rx="112" fill="#F1F2F7" />

  <!-- Notas cayendo con tonos de acento de la paleta -->
  <g>
    <!-- Nota 1 (más alta, más difusa/lejana) -->
    <rect x="180" y="110" width="44" height="120" rx="14" fill="#8B83FF" opacity="0.4" />
    
    <!-- Nota 2 (central, principal) -->
    <rect x="250" y="150" width="52" height="160" rx="16" fill="#8B83FF" />

    <!-- Nota 3 (derecha, más corta) -->
    <rect x="330" y="200" width="44" height="110" rx="14" fill="#65D6A6" opacity="0.9" />
  </g>

  <!-- Línea base oscura que representa el teclado / punto de impacto -->
  <rect x="96" y="340" width="320" height="12" rx="6" fill="#0C0D13" />
</svg>